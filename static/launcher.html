<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AIGC · ComfyUI</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/launcher.css">
  <script src="/static/launcher.js" defer></script>
</head>
<body>
  <header><a class="brand" href="/">AIGC <span>ComfyUI</span></a><a href="/workbench?engine=voxcpm2">语音与声音克隆</a></header>
  <main>
    <p class="eyebrow">DGX · 本地连接与作品管理</p>
    <h1>在 ComfyUI 中创作</h1>
    <p class="intro">使用完整节点界面。生成结果自动保存到本机；断开或空闲 10 分钟后，回收服务器实例与会话文件。</p>
    <section class="connection" aria-label="服务器连接">
      <label for="engine">模型环境</label>
      <select id="engine"><option value="qwen21">Qwen Image 2.1 · 图片</option><option value="h3">MiniMax H3 · 视频</option><option value="music3">MiniMax Music 3 · 音乐</option></select>
      <div class="actions"><button id="connect">启动 ComfyUI</button><a id="open-comfy" class="button" href="/comfy/" target="_blank" rel="noopener" hidden>打开 ComfyUI ↗</a><button id="disconnect" class="secondary" hidden>断开并清理</button></div>
      <p id="status" role="status">正在读取连接状态…</p>
      <p id="error" role="alert" hidden></p>
    </section>
    <section aria-label="已有模型工作流">
      <h2>从已有工作流开始</h2>
      <p>下载模板后，拖入 ComfyUI 画布。图片编辑和视频模板需要先在 LoadImage 节点上传参考图。</p>
      <div id="templates" class="templates"></div>
      <p class="note">服务器素材在本次会话中可重复使用。结束会话会清理输入、输出和临时文件；工作流、设置与已归档结果保留在本机。</p>
    </section>
    <section aria-label="本地归档"><h2>最近任务</h2><div id="jobs"><p>暂无 ComfyUI 任务。</p></div></section>
    <details><summary>连接诊断与退出</summary><pre id="logs"></pre><button id="shutdown" class="secondary">关闭本地管理器</button></details>
  </main>
</body>
</html>
